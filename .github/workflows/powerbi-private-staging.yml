name: Power BI private staging (validation only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tse-onedrive-refresh-token
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check private integration configuration
        env:
          TSE_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.TSE_ONEDRIVE_REFRESH_TOKEN }}
          TSE_GITHUB_SECRETS_TOKEN: ${{ secrets.TSE_GITHUB_SECRETS_TOKEN }}
        run: |
          if [ -z "$TSE_ONEDRIVE_REFRESH_TOKEN" ] || [ -z "$TSE_GITHUB_SECRETS_TOKEN" ]; then
            echo 'Private integration credentials are missing; nothing was downloaded or uploaded.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pynacl==1.6.2
      - name: Run existing tests
        run: python -m pytest -q
      - name: Collect current TSE sources
        run: |
          python -m pipeline.ingest --refresh
          python -m pipeline.results
          python -m pipeline.runoff
      - name: Build and validate clean models
        run: |
          dbt build --project-dir . --profiles-dir .
          python -m pipeline.export
      - name: Prepare and verify private staging
        env:
          TSE_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.TSE_ONEDRIVE_REFRESH_TOKEN }}
          TSE_GITHUB_SECRETS_TOKEN: ${{ secrets.TSE_GITHUB_SECRETS_TOKEN }}
        run: python powerbi/stage_cli.py --repo . --collected work --output "$RUNNER_TEMP/tse-powerbi-staging"
