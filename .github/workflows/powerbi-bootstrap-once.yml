name: One-time OneDrive authentication
on:
  push:
    branches: [powerbi-private-staging]
    paths:
      - powerbi/bootstrap-public.pem
      - powerbi/bootstrap_ci.py
      - .github/workflows/powerbi-bootstrap-once.yml
permissions:
  contents: read
jobs:
  authenticate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.5 cryptography==46.0.3 pynacl==1.6.2
      - name: Authorize the university OneDrive
        env:
          TSE_GITHUB_SECRETS_TOKEN: ${{ secrets.TSE_GITHUB_SECRETS_TOKEN }}
        run: python powerbi/bootstrap_ci.py
