name: Power BI GitHub credential preflight

on:
  push:
    branches:
      - powerbi-private-staging

permissions:
  contents: read

jobs:
  verify-github-secret-access:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check access to repository secret encryption key
        env:
          TSE_GITHUB_SECRETS_TOKEN: ${{ secrets.TSE_GITHUB_SECRETS_TOKEN }}
        run: |
          if [ -z "$TSE_GITHUB_SECRETS_TOKEN" ]; then
            echo 'Repository-scoped credential missing.'
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $TSE_GITHUB_SECRETS_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/OPedroZampier/tse-2026-elt/actions/secrets/public-key)
          if [ "$status" != 200 ]; then
            echo "Credential check failed (HTTP $status)."
            exit 1
          fi
          echo 'Repository secret encryption key is accessible.'
