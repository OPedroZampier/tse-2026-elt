name: Power BI guarded activation validation
on:
  push:
    branches: [powerbi-private-staging]
    paths: [.github/workflows/powerbi-activation-test-once.yml]
permissions:
  contents: read
concurrency:
  group: tse-onedrive-refresh-token
  cancel-in-progress: false
jobs:
  activate-validation:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          pip install -r requirements.txt pynacl==1.6.2
          python -m pytest -q
      - name: Collect and verify TSE data
        run: |
          python -m pipeline.ingest --refresh
          python -m pipeline.results
          python -m pipeline.runoff
          dbt build --project-dir . --profiles-dir .
          python -m pipeline.export
      - name: Stage and activate verified test batch with backup
        env:
          TSE_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.TSE_ONEDRIVE_REFRESH_TOKEN }}
          TSE_GITHUB_SECRETS_TOKEN: ${{ secrets.TSE_GITHUB_SECRETS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, 'powerbi')
          from github_refresh_secret import replace_refresh_secret
          from powerbi_delegated_auth import exchange_refresh_token
          from powerbi_onedrive_stage import GraphTransport, stage
          from run_powerbi_private_reference import run_with_private_reference
          from activate_onedrive_batch import activate
          refresh = os.environ['TSE_ONEDRIVE_REFRESH_TOKEN']
          github = os.environ['TSE_GITHUB_SECRETS_TOKEN']
          access = exchange_refresh_token(refresh, lambda replacement: replace_refresh_secret(replacement, github))
          graph = GraphTransport(access)
          output = Path(os.environ['RUNNER_TEMP']) / 'tse-activation-validation'
          built = run_with_private_reference(Path('.'), output, graph, Path('work'))
          reference = output / 'reference' / 'manifest.json'
          batch = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          receipt = stage(built['assembled'], reference, graph, batch)
          receipt_path = output / 'receipt.json'
          receipt_path.write_text(json.dumps(receipt), encoding='utf-8')
          result = activate(built['assembled'], reference, receipt_path, output / 'manifest-backup.json', graph)
          if not result['manifest_updated'] or result['model_refresh_started']:
              raise RuntimeError('Unexpected activation result')
          print('Verified batch activated with private backup; Power BI refresh not started.')
          PY
