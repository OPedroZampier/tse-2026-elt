name: Power BI private backup validation
on:
  push:
    branches: [powerbi-private-staging]
    paths: [.github/workflows/powerbi-backup-test-once.yml]
permissions:
  contents: read
concurrency:
  group: tse-onedrive-refresh-token
  cancel-in-progress: false
jobs:
  test-backup:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.5 pynacl==1.6.2
      - name: Validate backup in an isolated folder
        env:
          TSE_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.TSE_ONEDRIVE_REFRESH_TOKEN }}
          TSE_GITHUB_SECRETS_TOKEN: ${{ secrets.TSE_GITHUB_SECRETS_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'powerbi')
          from github_refresh_secret import replace_refresh_secret
          from powerbi_delegated_auth import exchange_refresh_token
          from powerbi_onedrive_stage import GraphTransport
          from activate_onedrive_batch import save_remote_backup
          refresh = os.environ['TSE_ONEDRIVE_REFRESH_TOKEN']
          github = os.environ['TSE_GITHUB_SECRETS_TOKEN']
          access = exchange_refresh_token(refresh, lambda replacement: replace_refresh_secret(replacement, github))
          graph = GraphTransport(access)
          batch_name = 'backup_validation_' + os.environ['GITHUB_RUN_ID']
          batch_id = graph.create_folder(graph.project_batches_folder(), batch_name)
          receipt = {'batch_id': batch_name, 'remote_batch_id': batch_id}
          save_remote_backup(graph, receipt, b'{"validation":true}')
          print('Private backup verified. Live manifest unchanged.')
          PY
